name: Deploy phone app to GitHub Pages

# Publishes the static mobile/ PWA to GitHub Pages — free HTTPS hosting.
# Only the mobile/ folder is uploaded, so the site root IS the app and nothing
# else in the repo is exposed. Everything sensitive is encrypted client-side
# with the user's PIN, so the host (GitHub) never sees keys or code.

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stamp the build so the phone can say which one it is running. "Is my
      # phone on the fix or a cached copy?" was guessed at repeatedly; it is
      # now a thing you can read in Settings.
      - name: Stamp the build
        run: |
          sed -i "s|name=\"mnm-build\" content=\"dev\"|name=\"mnm-build\" content=\"${GITHUB_SHA::7}\"|" mobile/index.html
          grep -o 'name="mnm-build" content="[^"]*"' mobile/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 20 minutes rather than the default 10. Only one Pages deployment can
          # be in flight at a time, so merging twice within a few minutes puts
          # the second one behind the first, and it can sit in
          # deployment_queued for longer than the default allows — reported as
          # a failed deploy on a build that was fine. That happened here.
          #
          # Waiting longer is the whole fix. Do NOT re-run a timed-out run to
          # recover: this job both uploads the artifact and deploys it, so a
          # re-run uploads a SECOND artifact named github-pages and every
          # further attempt fails with "Multiple artifacts named github-pages
          # were unexpectedly found" — that run is then unrecoverable. Dispatch
          # a fresh run instead, which is what workflow_dispatch above is for.
          timeout: 1200000
