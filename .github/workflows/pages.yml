name: Deploy phone app to GitHub Pages

# Publishes the static mobile/ PWA to GitHub Pages — free HTTPS hosting.
# Only the mobile/ folder is uploaded, so the site root IS the app and nothing
# else in the repo is exposed. Everything sensitive is encrypted client-side
# with the user's PIN, so the host (GitHub) never sees keys or code.

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stamp the build so the phone can say which one it is running. "Is my
      # phone on the fix or a cached copy?" was guessed at repeatedly; it is
      # now a thing you can read in Settings.
      - name: Stamp the build
        run: |
          sed -i "s|name=\"mnm-build\" content=\"dev\"|name=\"mnm-build\" content=\"${GITHUB_SHA::7}\"|" mobile/index.html
          grep -o 'name="mnm-build" content="[^"]*"' mobile/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Asks for 20 minutes instead of the default 10. NOTE: it does not
          # appear to take effect — two separate runs with this set still
          # aborted at 602s and 601s, i.e. the 600000 default. The input is
          # documented on deploy-pages@v4 and the value is a plain number of
          # milliseconds, so why it is ignored is not understood. It is left
          # here because it is correct per the docs and costs nothing; it is
          # not something to rely on.
          timeout: 1200000
          # WHAT TO DO WHEN A DEPLOY FAILS ON "Timeout reached, aborting!"
          #
          # The build is almost certainly fine — every step before this one
          # succeeded and the failure is this action giving up on a deployment
          # that never left deployment_queued. Only one Pages deployment can be
          # in flight per repo, and that lock can wedge: five attempts over 70
          # minutes failed identically here, so it is a stall, not a queue.
          #
          # 1. Do NOT re-run the run. This job uploads the artifact AND deploys
          #    it, so a re-run uploads a SECOND artifact named github-pages and
          #    every further attempt fails with "Multiple artifacts named
          #    github-pages were unexpectedly found". That run is then
          #    unrecoverable. Dispatch a fresh run instead — which is what the
          #    workflow_dispatch trigger above is for.
          # 2. If fresh runs keep timing out, the lock is wedged and no change
          #    in this file will help. Settings → Pages → Source: switch away
          #    from GitHub Actions, save, switch back, save. That clears it in
          #    most reports.
          # 3. If it still will not deploy, it is an infrastructure-level lock
          #    only GitHub can reset. Open a support ticket saying: "Repository
          #    Pages deployment environment is stuck in a wedged state during
          #    the finalization phase."
