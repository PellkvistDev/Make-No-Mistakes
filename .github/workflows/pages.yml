name: Deploy phone app to GitHub Pages

# Publishes the static mobile/ PWA to GitHub Pages — free HTTPS hosting.
# Only the mobile/ folder is published, so the site root IS the app and nothing
# else in the repo is exposed. Everything sensitive is encrypted client-side
# with the user's PIN, so the host (GitHub) never sees keys or code.
#
# WHY THIS PUSHES A BRANCH INSTEAD OF USING actions/deploy-pages.
#
# deploy-pages creates a Pages deployment and then polls for it to finish. Its
# wait is capped at ten minutes and the cap is not adjustable:
#
#   const MAX_TIMEOUT = 600000
#   this.timeout = Math.min(timeoutInput, MAX_TIMEOUT)
#
# so a `timeout:` input larger than that is silently clamped. Worse, when the
# wait runs out the action does not merely fail the job — it calls
# cancelPagesDeployment() and kills the deployment on GitHub's side.
#
# On 2026-08-06 Pages was taking longer than ten minutes to finalise for this
# repo. Eight consecutive runs built perfectly, waited, and then cancelled a
# deployment that was working: one of them reached deployment_in_progress at
# 9:58 of its 10:00 budget and was cancelled five seconds later. Nothing in a
# workflow file can widen that window.
#
# Publishing from a branch has no client-side canceller. GitHub's own
# pages-build-deployment runs after this push and takes as long as it takes.
# The cost is that the Pages source is a repo SETTING, so this file only works
# while Settings → Pages → Source is "Deploy from a branch" → gh-pages / (root).
# Switching that back to "GitHub Actions" silently ignores everything here.

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# contents: write to push the gh-pages branch. No pages/id-token scopes are
# needed any more — nothing here talks to the Pages deployment API.
permissions:
  contents: write

# Let a running publish finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stamp the build so the phone can say which one it is running. "Is my
      # phone on the fix or a cached copy?" was guessed at repeatedly; it is
      # now a thing you can read in Settings.
      - name: Stamp the build
        run: |
          sed -i "s|name=\"mnm-build\" content=\"dev\"|name=\"mnm-build\" content=\"${GITHUB_SHA::7}\"|" mobile/index.html
          grep -o 'name="mnm-build" content="[^"]*"' mobile/index.html
      - name: Publish mobile/ to the gh-pages branch
        run: |
          set -euo pipefail
          # Copy the site out before rewriting the worktree, so the branch ends
          # up containing mobile/'s CONTENTS at its root — the site root is the
          # app, exactly as before.
          site=$(mktemp -d)
          cp -R mobile/. "$site"/
          # Plain static files; Jekyll would otherwise eat anything starting
          # with an underscore.
          touch "$site/.nojekyll"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Orphan + rm -rf so the published branch carries the site and
          # nothing else: no repo history, no source, no workflows.
          git checkout --orphan gh-pages
          git rm -rf . > /dev/null
          cp -R "$site"/. .
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          # Force, because each publish is a fresh single-commit history rather
          # than a line to fast-forward. Safe: this branch is a build output —
          # it is written only here and never has anything worth keeping.
          # Uses the credentials actions/checkout persisted, so no token ends
          # up on a command line.
          git push -f origin gh-pages
