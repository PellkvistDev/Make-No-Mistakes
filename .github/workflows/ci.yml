name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned rather than left to the runner's default, because several
      # sync tests shell out to node to prove the Python and JS codecs agree
      # byte for byte. If node vanished from the image those tests would skip
      # silently and the interop contract would stop being checked at all.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The test suite exercises the core only (agent loop, API retry,
      # steering, sub-agents, backups, sessions, memory) -- it needs no GUI
      # deps, no ML deps, and makes no network calls.
      #
      # cryptography is not optional here even though the app degrades without
      # it: every test of the sync store's encryption, the secret store, and
      # the pairing wire format is gated on it being importable, and a gated
      # test that never runs is indistinguishable from one that passes.
      # segno for the same reason as cryptography: the pairing tests assert how
      # many modules the QR comes out at, because that number is what decides
      # whether a phone camera can read it and a field added to the payload is
      # how it quietly creeps back up. Without segno those tests skip, and a
      # skipped assertion is indistinguishable from a passing one.
      - run: pip install requests pytest cryptography segno
      - run: python -m pytest tests/ -q
      # The eval CASES must not rot: each one only measures something
      # while its check still fails before the agent touches it, and a
      # fixture accidentally repaired elsewhere would turn into a free
      # pass for every configuration. tests/test_evals.py re-checks that
      # offline; nothing here calls a model or spends quota.
      # The phone's logic layer: crypto, the sync store, context budgeting,
      # the agent loop. It had never run here, so every green check on every
      # phone change was green without it.
      #
      # Listed one by one rather than by glob: a glob that stops matching is
      # indistinguishable from a suite that passes. test_ci.py fails if a
      # mobile/*.test.js file exists that is not named here.
      - run: node --test mobile/agent-core.test.js mobile/sw.test.js

  # The UI layers, in a separate job because they need a browser. These are what
  # unit tests cannot reach: the phone's wiring (where a chat resume silently
  # wiped the desktop handoff queue) and the desktop's 5591-line app.js, which
  # had no coverage of any kind until now.
  browser-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # cryptography because the pairing tests seal a token with the desktop's
      # own code and open it in the real phone app -- that is what pins the two
      # halves of the wire format together.
      #
      # requests and segno are not optional here either, and the reason is
      # worth stating: those pairing tests reach glmcode.pairing through
      # importorskip, so for want of requests they were SKIPPING in this job,
      # silently, while the comment above claimed they ran. segno draws the QR
      # the scanner tests play through the fake camera. A skipped test and a
      # passing one look identical in a green check.
      - run: pip install pytest playwright cryptography requests segno
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/mobile_ui tests/desktop_ui -q
