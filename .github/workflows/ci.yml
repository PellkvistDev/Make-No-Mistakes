name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned rather than left to the runner's default, because several
      # sync tests shell out to node to prove the Python and JS codecs agree
      # byte for byte. If node vanished from the image those tests would skip
      # silently and the interop contract would stop being checked at all.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The test suite exercises the core only (agent loop, API retry,
      # steering, sub-agents, backups, sessions, memory) -- it needs no GUI
      # deps, no ML deps, and makes no network calls.
      - run: pip install requests pytest
      - run: python -m pytest tests/ -q
      # The phone's logic layer: crypto, the sync store, context budgeting,
      # the agent loop. It had never run here, so every green check on every
      # phone change was green without it.
      - run: node --test mobile/agent-core.test.js

  # The phone's UI wiring is a separate job because it needs a browser. It is
  # the layer agent-core.test.js cannot reach -- and the layer where a chat
  # resume silently wiped the desktop handoff queue, because nothing drove the
  # real app end to end.
  mobile-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/mobile_ui -q
